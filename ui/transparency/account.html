<!DOCTYPE html>
<html lang="en">
<head>
    <title>TrAI</title>
    <meta charset="utf-8">
    <meta name="description" content="Transparency services for AI models">
    <meta name="robots" content="index, follow"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="author" content="mever">
    <link rel="shortcut icon" href="img/favicon.png"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/foundation.css"/>
    <link rel="stylesheet" href="css/normalize.css"/>
    <link rel="stylesheet" href="css/account.css"/>
    <link rel="stylesheet" href="css/card.css"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
</head>
<body>
<script src="js/themes.js"></script>
<section class="header">
    <div class="row bigWidth">
        <div class="small-12 medium-12 large-12 columns">
            <div class="header_wrapper">
                <div id="service-logo"><a href="index.html" class="title success">Transparent AI</a></div>
                <p id="logout-btn" class="hidden warning button"><i class="fa-solid fa-right-from-bracket"></i>&nbsp;&nbsp;Logout</p>
                <p id="password-open-btn" class="hidden warning button"><i class="fa-solid fa-key"></i>&nbsp;&nbsp;Update password</p>
                <p class="greet">Welcome <span id="account-name"></span></p>
            </div>
        </div>
    </div>
</section>
<section class="account_section" id="account-section">
    <div class="row bigWidth is-admin" style="margin-top:40px; display: none">
        <div class="small-12 medium-12 large-12 columns">
            <div id="resources"><canvas id="metrics-chart" style="max-height: 300px;"></canvas></div>
            <div id="pending-users"></div>
            <div id="registered-users"></div>
            <div id="theme-selector-container">
                <h2>Themes</h2>
                <select name="themes" id="theme-selector">
                    <option value="light-theme" selected="selected">Light</option>
                    <option value="dark-theme">Dark</option>
                    <option value="ocean-theme">Ocean</option>
                </select>
            </div>

            <div id="cards"></div>
            <div id="reported"></div>
        </div>
    </div>
</section>

<section data-hide-in-iframe class="footer_section">
    <div class="row bigWidth footer_section_icons">
        <img class="footer_section_logo" src="img/logo_og.png">
        <img class="footer_section_eu" src="img/logo_FoundedbyEU_black.png">
    </div>
    <div class="row bigWidth footer_section_text">
        Empowering media professionals against disinformation.
        This project has received funding from the European Union’s Horizon Europe research and innovation programme
        under grant agreement No. 101135437
    </div>
</section>

<div id="password-modal-screen" class="delete-confirm-screen">
    <div class="delete-confirm-content">
        <h2>Update password</h2>
        <div class="title error" id="password-error"></div>
        <br><br>
        <label for="password">New password</label><br>
        <input type="password" id="password" placeholder="New password" class="text-input">
        <br><br>
        <label for="password-verify">Verify new password</label><br>
        <input type="password" id="password-verify" placeholder="Verify password" class="text-input">
        <br><br><br><br>
        <div class="buttons">
            <button id="confirm-password-btn" class="button warning"><i class="fa-solid fa-key"></i>&nbsp;&nbsp;Save</button>
            <button id="cancel-password-btn" class="button"><i class="fa-solid fa-cancel"></i>&nbsp;&nbsp;Cancel</button>
        </div>
    </div>
</div>

<div id="report-modal-screen" class="delete-confirm-screen">
    <div class="delete-confirm-content">
        <h2><span id="report-card-name"></span></h2>
        <div id="report-list"></div>
        <div class="buttons">
            <button id="cancel-report-btn" class="button"><i class="fa-solid fa-cancel"></i>&nbsp;&nbsp;Close</button>
        </div>
    </div>
</div>


<!-- JS -->
<script src="js/themes.js"></script>
<script src="js/shellui.js"></script>
<script src="js/bearer.js"></script>
<script src="js/account/main.js"></script>
</body>
</html>

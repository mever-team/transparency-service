<!DOCTYPE html>
<html lang="en">
<head>
    <title>TrAI</title>
    <meta charset="utf-8">
    <meta name="description" content="Transparency services for AI models">
    <meta name="robots" content="index, follow"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="author" content="laaposto">
    <link rel="shortcut icon" href="img/favicon.png"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/foundation.css"/>
    <link rel="stylesheet" href="css/normalize.css"/>
    <link rel="stylesheet" href="css/account/main.css"/>
</head>
<body>


<section class="header_section">
    <div class="row bigWidth">
        <div class="small-12 medium-12 large-12 columns">
            <div class="header_wrapper" style="display:inline;float:left">
                <div class="row-top">
                <div id="service-logo"><a href="index.html" style="color: #64DB96">Transparent AI</a></div>
                <div class="row-top-inner bigWidth" style="margin-top:-10px">
                    <div id="model-quality"></div>
                    <div>
                        <div id="model-name" style="font-size:30px;color:#EEEEEE" class="model-title"></div>
                        <div>
                            <div id="model-pending" style="color:#F9AB49;font-size:16px"></div>
                            <div id="model-description" style="color:#79CFDC;font-size:16px"></div>
                        </div>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </div>
</section>
<section class="account_section" id="account-section" style="display:none;">
    <div class="row bigWidth">
        <div class="small-12 medium-8 large-6 columns">
            <div class="login-confirm-content" style="margin-top:40px">
                <h2 style="color:#64DB96;margin-bottom:20px">Account</h2>

                <!-- Change Email -->
                <div style="margin-bottom:30px">
                    <h4 style="color:#EEEEEE">Change email</h4>
                    <label for="account-email">New email</label><br />
                    <input type="text" id="account-email" name="account-email" /><br><br>
                    <button style="background-color:#64DB96;color:#1F1F1F;border:0;width:160px">
                        Update email
                    </button>
                </div>

                <!-- Change Password -->
                <div style="margin-bottom:10px">
                    <h4 style="color:#EEEEEE">Change password</h4>
                    <label for="account-password">New password</label><br />
                    <input type="password" id="account-password" /><br><br>
                    <label for="account-password-verify">Verify password</label><br />
                    <input type="password" id="account-password-verify" /><br><br>
                    <button style="background-color:#64DB96;color:#1F1F1F;border:0;width:160px">
                        Update password
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin-only section -->
    <div class="row bigWidth is-admin" style="display:none;margin-top:40px">
        <div class="small-12 medium-12 large-12 columns">
            <div class="login-confirm-content">
                <h3 style="color:#F9AB49;margin-bottom:20px">Administration</h3>

                <div style="margin-bottom:30px">
                    <h4 style="color:#EEEEEE">Pending users</h4>
                    <div id="pending-users"
                         style="border:1px solid #434343;padding:15px;color:#7C7C7C">
                        <!-- pending users list placeholder -->
                    </div>
                </div>

                <div>
                    <h4 style="color:#EEEEEE">Registered users</h4>
                    <div id="registered-users"
                         style="border:1px solid #434343;padding:15px;color:#7C7C7C">
                        <!-- registered users list placeholder -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="js/account/bearer.js"></script>
<script src="js/account/main.js"></script>
</body>
</html>

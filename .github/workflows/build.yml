name: Build

on:
  push:
    branches:
      - dev


jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: |
          pip install -e ./package
          pip install pytest pytest-cov pytest-timeout
      - name: Install Node dependencies
        run: |
          npm ci
      - name: Set Chrome binary
        run: |
          echo "CHROME_BIN=$(node -e "require('puppeteer').executablePath().then(console.log)")" >> $GITHUB_ENV
      - name: Create .env file
        run: |
          cat > ui/.env <<EOF
          USER=admin
          PASS=admin
          INDEX=index.html
          EOF
      - name: Create database directory
        run: mkdir -p db_pytest
      - name: Run Python backend tests
        run: pytest
      - name: Verify coverage.xml file exists
        run: |
          if [ ! -f coverage.xml ]; then
            echo "coverage.xml not found!"
            exit 1
          fi
      - name: Start transparency server
        run: |
          python -m ui.no_ollama_server > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5000/transparency/ > /dev/null; then
              echo "Server is ready"
              sleep 30
              exit 0
            fi
            echo "Waiting for server..."
            sleep 10
          done
          echo "Server failed to start"
          cat server.log
          exit 1
      - name: Run Karma frontend tests
        run: |
          npx karma start tests_front/karma.index.conf.js
      - name: Verify lcov.info file exists
        run: |
          ls -R coverage
          if [ ! -f coverage/lcov.info ]; then
            echo "lcov.info not found!"
            exit 1
          fi
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid)
          fi
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # - uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

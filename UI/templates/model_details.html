<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user_input.css') }}">
    <script src="{{ url_for('static', filename='js/buttonchangehtml.js') }}"></script>

</head>
<body>
    <div><button class="dynamic-btn" data-button-name="Back">Back</button></div>
    {{ model_details_textareas|safe }}
    <!---
    <b>Model Details</b>
    <textarea id="model_details" placeholder="Waiting for input...">{{ model_details }}</textarea>
    -->


    <div><button data-button-name="Upload PDF" id="uploadBtn">Upload PDF</button></div>
    <input type="file" id="fileInput" style="display: none;">
    <button class="dynamic-btn" data-button-name="Submit from model details">Submit</button>

  <script>

    fileInput = document.getElementById("fileInput");
    uploadBtn = document.getElementById("uploadBtn");



    uploadBtn.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("file", file);
      formData.append("button", "Upload PDF");
      formData.append("field", "Model Details");

      fetch("/upload", {
        method: "POST",
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        changePaneContent(data.new_left_html, data.new_right_html);



                document.querySelectorAll("textarea").forEach(textarea => {
            const skipIds = ["airesponse", "textInput"];

            if (skipIds.includes(textarea.id)) {
                return; // skip this textarea
            }

            ClassicEditor
                .create(textarea)
                .then(editor => {
                    editorInstances[textarea.id] = editor;

                    // only show toolbar if focused
                    const toolbar = editor.ui.view.toolbar.element;
                    toolbar.style.display = "none";
                    editor.editing.view.document.on('focus', () => {toolbar.style.display = "";});
                    editor.editing.view.document.on('blur', () => {toolbar.style.display = "none";});
                })
                .catch(error => {
                    console.error("Editor initialization failed for textarea:", textarea, error);
                });
        });
    })
    .catch(error => console.error('Error:', error));
    });


  </script>

</body>
</html>

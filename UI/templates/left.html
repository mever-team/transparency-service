<div>
    <h2>Left Content</h2>
    <p>This is the default left content. You can replace it dynamically.</p>

    <!-- Change Content Button (inside left.html) -->
    <button id="changeContentBtn">Change Content</button>
</div>

<script>
    document.getElementById('changeContentBtn').addEventListener('click', function() {
        // Sending new templates to be used for left and right sections
        fetch('/change_templates', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                left_template: 'new_left.html',  // Example template name for the left section
                right_template: 'new_right.html'  // Example template name for the right section
            })
        })
        .then(response => response.json())
        .then(data => {
            // Updating the iframe sources to use the new templates dynamically
            window.location.href = `/?left_src=${data.new_left_src}&right_src=${data.new_right_src}`;
        })
        .catch(error => console.error('Error:', error));
    });
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user_input.css') }}">
    <script src="{{ url_for('static', filename='js/buttonchangehtml.js') }}"></script>

</head>
<body>
    <div><button class="dynamic-btn" data-button-name="Back">Back</button></div>
    <b>Training Set</b>
    <textarea id="training_set" placeholder="Waiting for input...">{{ training_set }}</textarea>
    <div>{{ training_set_plots|safe }}</div>
    <button class="dynamic-btn" data-button-name="Submit from training set">Submit Form</button>
<!--    <button class="dynamic-btn" data-button-name="AI Data Summary Train Set">AI Data Summary</button>-->
    <div><button data-button-name="AI Data Summary Train Set" id="uploadBtn">AI Data Summary</button></div>
    <input type="file" id="fileInput" style="display: none;">
    <div>{{ data_set_outline_training|safe }}</div>
    <div>{{ create_plot_buttons_train|safe }}</div>


  <script>

    fileInput = document.getElementById("fileInput");
    uploadBtn = document.getElementById("uploadBtn");



    uploadBtn.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("file", file);
      formData.append("button", "AI Data Summary Train Set");
      formData.append("field", "Training Set");

      fetch("/upload", {
        method: "POST",
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        changePaneContent(data.new_left_html, data.new_right_html);



                document.querySelectorAll("textarea").forEach(textarea => {
            const skipIds = ["airesponse", "textInput"];

            if (skipIds.includes(textarea.id)) {
                return; // skip this textarea
            }

            ClassicEditor
                .create(textarea)
                .then(editor => {
                    editorInstances[textarea.id] = editor;

                    // only show toolbar if focused
                    const toolbar = editor.ui.view.toolbar.element;
                    toolbar.style.display = "none";
                    editor.editing.view.document.on('focus', () => {toolbar.style.display = "";});
                    editor.editing.view.document.on('blur', () => {toolbar.style.display = "none";});
                })
                .catch(error => {
                    console.error("Editor initialization failed for textarea:", textarea, error);
                });
        });
    })
    .catch(error => console.error('Error:', error));
    });


  </script>
</body>
</html>
